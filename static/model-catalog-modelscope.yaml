# Cloudpods LLM model catalog.
# keeping Qwen / DeepSeek / Whisper / MiniMax / GLM families only.
# Specs are limited to vLLM / SGLang; Ascend (MindIE / vendor:ascend) and other backends are omitted.
model_sets:
- name: Qwen3-0.6B
  description: Qwen3 is a family of large language models in Qwen series, offering a comprehensive suite
    of dense and mixture-of-experts (MoE) models. Built upon extensive training, Qwen3 delivers groundbreaking
    advancements in reasoning, instruction-following, agent capabilities, and multilingual support.
  home: https://qwenlm.github.io
  icon: /static/catalog_icons/qwen.png
  size: 0.6
  categories:
  - llm
  capabilities:
  - context/128K
  - tools
  licenses:
  - apache-2.0
  release_date: '2025-04-19'
  specs:
  - mode: standard
    quantization: BF16
    source: model_scope
    model_scope_model_id: Qwen/Qwen3-0.6B
    backend: vLLM
    backend_parameters:
    - --reasoning-parser=deepseek_r1
    - --max-model-len=8192
